[project]
name = "gptbot"
version = "0.1.0"
description = "Telegram bot powered by ChatGPT via Codex Sale (OpenAI-compatible API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4.0",
    "aiosqlite>=0.20",
    "openai>=1.40,<2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
gptbot = "bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
